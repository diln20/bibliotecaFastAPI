name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Pages status
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          headers = {"Accept": "application/vnd.github+json"}
          headers["Authorization"] = "Bearer " + os.environ["GITHUB_TOKEN"]

          def fetch_json(url):
              request = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(request) as response:
                      status_code = response.status
                      body = response.read().decode()
              except urllib.error.HTTPError as exc:
                  status_code = exc.code
                  body = exc.read().decode()

              payload = {}
              if body:
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError:
                      payload = {}

              return status_code, body, payload

          repo_status, repo_body, repo_response = fetch_json(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if repo_status == 200:
                  if not repo_response.get("has_pages"):
                      output.write("enabled=false\n")
                      print("::notice::GitHub Pages is not enabled for this repository. Skipping deployment. Enable it in Settings > Pages and choose GitHub Actions as the source.")
                  else:
                      pages_status, pages_body, pages_response = fetch_json(
                          f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages"
                      )

                      if pages_status == 200:
                          if pages_response.get("build_type") == "workflow":
                              output.write("enabled=true\n")
                          else:
                              output.write("enabled=false\n")
                              print("::notice::GitHub Pages is enabled, but it is not configured to publish from GitHub Actions. Select GitHub Actions in Settings > Pages to enable this deployment workflow.")
                      else:
                          output.write("enabled=false\n")
                          print(f"::error::Unable to read GitHub Pages configuration (HTTP {pages_status}).")
                          sys.exit(1)
              else:
                  output.write("enabled=false\n")
                  print(f"::error::Unable to determine repository Pages status (HTTP {repo_status}).")
                  sys.exit(1)
          PY

  deploy:
    needs: check-pages
    if: needs.check-pages.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
